name: Build

# Se ejecuta en cada push y en cada Pull Request hacia main.
# Esto es la "validación automatizada" que exige la rúbrica:
# Cada PR mostrará un check verde/rojo, y queda historial
# permanente en la pestaña Actions del repositorio.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto con Maven
        working-directory: ./PetShop
        run: mvn -B clean package -DskipTests

      - name: Ejecutar pruebas (si existen)
        working-directory: ./PetShop
        run: mvn -B test
